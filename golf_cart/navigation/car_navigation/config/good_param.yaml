local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.5
      global_frame: odom
      robot_base_frame: hero
      use_sim_time: True
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.1
      footprint: "[[1.225, 0.6], [1.225, -0.6], [-1.225, -0.6], [-1.225, 0.6]]"
      
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: front_lidar
        front_lidar:
          topic: /carla/hero/fl_lidar
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.5  # Ignore the ground!
          max_obstacle_height: 2.0
          obstacle_min_range: 1.2     # Your blind spot
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0     # Allow clearing inside the blind spot
          raytrace_max_range: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 3.5
        cost_scaling_factor: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: hero
      use_sim_time: true
  
      transform_tolerance: 2.0
      footprint: "[[1.225, 0.6], [1.225, -0.6], [-1.225, -0.6], [-1.225, 0.6]]"
      resolution: 0.4
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: top_lidar
        pointcloud:
          topic: /carla/hero/top_lidar
          max_obstacle_height: 15.0  
          min_obstacle_height: -1.5
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 40.0
          obstacle_min_range: 1.0
          
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.2
        inflation_radius: 2.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    # Provide the absolute path to your map's yaml file
    yaml_filename: "/home/sedrica/carla/Workspace/mp_ws/py-scripts/carla_map.yaml"
    topic_name: "/map"
    frame_id: "map"

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: true
    transform_tolerance: 2.0
    

    # BT uses planner_id "GridBased", so keep that ID
    # but make it use SmacPlannerHybrid internally.
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.1
      downsample_costmap: true
      downsampling_factor: 2
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 6.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 5.0
      analytic_expansion_max_length: 50.0
      minimum_turning_radius: 4.5
      reverse_penalty: 100.0
      change_penalty: 0.1
      non_straight_penalty: 1.5
      cost_penalty: 5.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true
      viz_expansions: true
      
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    # behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    behavior_plugins: ["drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: hero
    transform_tolerance: 0.5
    use_sim_time: true
    simulate_ahead_time: 5.0
    max_rotational_vel: 0.2
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.1

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 50.0
    # For a car, keep scale_velocities false to maintain steering/speed ratios
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Max Speed: Reduced for safer simulation
    max_velocity: [0.6, 0.0, 0.4] 
    min_velocity: [-0.2, 0.0, -0.4]
    # Acceleration: Significantly dampened
    max_accel: [0.2, 0.0, 0.1]
    max_decel: [-0.4, 0.0, -0.2] # Cars usually brake harder than they accel
    odom_topic: "/carla/hero/odometry"
    odom_duration: 0.05
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    input_topic: "/cmd_vel_nav"
    output_topic: "/cmd_vel_smoothed"

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "hero"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "/cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: true

    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/carla/hero/fl_lidar"
      enabled: true
      min_height: 0.1
      max_height: 2.0

    polygons: ["PolygonStop"]
    PolygonStop:
      type: "polygon"
      points: "[[1.40, 0.5], [1.40, -0.5], [-1.40, -0.5], [-1.40, 0.5]]"
      action_type: "stop"  
      min_points: 10
      visualize: true
      polygon_pub_topic: "polygon_stop"

nav2_lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    node_names:
      - planner_server
      - controller_server
      - bt_navigator
      - behavior_server
      - velocity_smoother 
      - map_server
        # - collision_monitor