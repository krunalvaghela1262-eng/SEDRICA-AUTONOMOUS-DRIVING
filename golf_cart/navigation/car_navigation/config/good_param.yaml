controller_server:
  ros__parameters:
    use_sim_time: True

    controller_frequency: 20.0
    min_x_velocity_threshold: 0.03
    min_y_velocity_threshold: 0.03
    min_theta_velocity_threshold: 0.3
    failure_tolerance: 2.0

    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker_plugin: "goal_checker"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.2
      stateful: True

    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Velocity/accelaration limits also have to be adjusted in the velocity smoother
      desired_linear_vel: 0.5
      lookahead_dist: 1.8
      min_lookahead_dist: 1.2
      max_lookahead_dist: 4.0
      lookahead_time: 2.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

      use_regulated_linear_velocity_scaling: true # Whether to use the regulated features for path curvature (e.g. slow on high curvature paths).
      use_cost_regulated_linear_velocity_scaling: true # Whether to use the regulated features for proximity to obstacles (e.g. slow in close proximity to obstacles).

      regulated_linear_scaling_min_radius: 5.5
      regulated_linear_scaling_min_speed: 0.1
      allow_reversing: false
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      # it is only used when rotating to heading (use_rotate_to_heading)
      # for some reason rotate_to_heading_angular_vel is ignored and robot rotates with
      # max_angular_accel/10. angular velocity (that's why it is set to higher value)
      max_angular_accel: 1.0
      rotate_to_heading_angular_vel: 0.5
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
      # Kinematic limits for trajectory generation
      acc_lim_x: 0.2
      acc_lim_theta: 0.1
      decel_lim_x: -0.4
      decel_lim_theta: -0.2
      
      # Matching velocities to the smoother
      min_vel_x: -0.2
      max_vel_x: 0.6
      
      # Important: Simulation time for trajectory projection
      # Increasing this (e.g., 2.5) helps the robot "see" further ahead
      sim_time: 2.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True



