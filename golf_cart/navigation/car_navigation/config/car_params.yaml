amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "differential"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /ouster/scan
    bond_heartbeat_period: 4.0
    subscribers:
      scan:
        topic: /ouster/scan
        reliability: best_effort
        durability: volatile

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ===== Velocity limits (MPPI-native) =====
      vx_max: 5.0        # ceiling, your node shrinks this dynamically
      vx_min: 0.0
      wz_max: 1.5

      # ===== MPPI rollout =====
      time_steps: 35
      model_dt: 0.06
      batch_size: 1500
      iteration_count: 1

      # ===== Noise =====
      vx_std: 0.2
      wz_std: 0.3

      # ===== Critics =====
      critics:
        [
          "PathAlignCritic",
          "PathFollowCritic",
          "ObstaclesCritic"
        ]

      PathAlignCritic:
        enabled: true
        cost_weight: 32.0

      PathFollowCritic:
        enabled: true
        cost_weight: 10.0

      ObstaclesCritic:
        enabled: true
        cost_weight: 20.0
        collision_cost: 100000.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.1

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8


map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/jetson/Developer/av_stack/src/vehicle_iitb/front_lidar.yaml"
    bond_timeout: 10.0  # <--- CHANGE THIS (Default is 4.0)
    


lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - amcl
      - controller_server
      - local_costmap
      - global_costmap
      - map_server
    bond_timeout: 10.0  # <--- CHANGE THIS (Default is 4.0)